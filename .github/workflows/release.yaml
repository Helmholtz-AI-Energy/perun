name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'
permissions:
  contents: read

jobs:
  Pypi-publish:
      name: Upload release to PyPI
      runs-on: ubuntu-latest
      # Specifying a GitHub environment is optional, but strongly encouraged
      environment:
        name: release
        url: https://pypi.org/p/perun
      permissions:
        contents: write
        id-token: write
      steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Checkout the tag that triggered the workflow
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build package
        run: |
          python -m build
      - name: Publish package distributions to PyPI
        # Only run if the tag is a release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1
      - name: Publish package to Test PyPI
        # Only run if the tag is a release candidate
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'rc')
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Extract tag name
        id: extract_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create --draft --generate-notes --title ${{ env.TAG_NAME }} --verify-tag ${{ env.TAG_NAME }} ./dist/**

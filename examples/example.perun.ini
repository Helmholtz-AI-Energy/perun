[post-processing]
power_overhead = 0
pue = 1.0
emissions_factor = 332
price_factor = 0.407
price_unit = €

[monitor]
sampling_period = 1
include_backends =
include_sensors =
exclude_backends =
exclude_sensors = CPU_FREQ_ CPU_USAGE_ DISK_READ_BYTES_ DISK_WRITE_BYTES_ NET_READ_BYTES_ NET_WRITE_BYTES_

[output]
app_name
run_id
format = text
data_out = ./perun_results

[benchmarking]
rounds = 1
warmup_rounds = 0
metrics = runtime,energy
region_metrics = runtime,power
# group_by: "host" (default) or "device" to break each host down per device.
group_by = host
# metric_stats: any of avg, min, max. min/max come from the raw sensor data and
# are only shown on per-device rows (group_by = device).
metric_stats = avg

[benchmarking.units]
joule = k
second =
percent =
watt =
byte = G

[debug]
log_lvl = WARNING
log_file

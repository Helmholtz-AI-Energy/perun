[post-processing]
power_overhead = 0
pue = 1.0
emissions_factor = 417.8
price_factor = 0.3251
price_unit = €

[monitor]
sampling_period = 1

[output]
app_name
run_id
format = text
data_out = ./perun_results

[benchmarking]
rounds = 1
warmup_rounds = 0
metrics = power,dram_mem
region_metrics = runtime,power
# group_by: "host" (default) or "device" to break each host down per device.
group_by = host
# metric_stats: any of avg, min, max. min/max come from the raw sensor data and
# are only shown on per-device rows (group_by = device).
metric_stats = avg

[benchmarking.units]
joule = k
second =
percent =
watt =
byte = M

[debug]
log_lvl = WARNING
